# OPTIONAL backup trigger for the programmatic SEO pipeline.
# The backend already runs the pipeline itself every day at 03:30 UTC (APScheduler in server.py).
# Only use this if Render sleeps/restarts and you see days with no new drafts.
# Replace YOUR_SUPERADMIN_SECRET with the SUPERADMIN_SECRET value from Render, then:
#   gcloud scheduler jobs import --file=cron_jobs.yaml   (or paste the same request into cron-job.org)

- job_id: pseo-daily-run
  description: "Generate new blog drafts from the keyword queue"
  http_target:
    http_method: POST
    uri: https://showup-backend-2bfj.onrender.com/api/seo/run
    body: '{"count": 1}'
    headers:
      Content-Type: application/json
      X-API-KEY: YOUR_SUPERADMIN_SECRET
  schedule: "45 3 * * *"
  time_zone: "UTC"
