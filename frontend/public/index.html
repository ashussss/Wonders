    <!-- ══ SCHEMA: FAQPage (AEO — Answer Engine Optimization) ══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I increase webinar attendance rate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The most effective way to increase webinar attendance is to send 6–8 reminder touches across multiple channels — not just one email reminder. Each touch should deliver value (an insight, poll question, or case study) rather than just saying 'don't forget'. ShowUpAI automates an 8-touch sequence across email, LinkedIn, Instagram, WhatsApp, Facebook and Circle.so, consistently lifting attendance from the industry average of 31% to 62%+."
          }
        },
        {
          "@type": "Question",
          "name": "What is the average webinar attendance rate?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The global average webinar attendance rate is 31–35% of registered attendees. This means roughly 65% of people who register never attend. ShowUpAI customers achieve an average of 62%+ attendance through AI-powered multi-channel reminder sequences."
          }
        },
        {
          "@type": "Question",
          "name": "What is ShowUpAI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ShowUpAI is an AI-powered webinar attendance software that automatically generates and schedules 8-touch multi-channel reminder sequences. It uses Claude AI to write confirmation emails, insight posts, poll questions, case studies, thought-provoking social content and FOMO messages — delivered across email, LinkedIn, Instagram, Facebook, WhatsApp and Circle.so. Users approve copy once and the system handles timing automatically."
          }
        },
        {
          "@type": "Question",
          "name": "How many reminder emails should I send before a webinar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Research shows 6–8 reminder touches significantly outperform single-reminder approaches. The optimal sequence is: immediate registration confirmation, 7-day insight email, 3-day poll or case study, 1-day practical reminder, morning-of thought-provoking post, 1-hour-before join link reminder, post-event attendee follow-up, and post-event no-show FOMO email. ShowUpAI automates this entire sequence."
          }
        },
        {
          "@type": "Question",
          "name": "What channels work best for webinar reminders?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Email has the highest direct conversion for webinar reminders. LinkedIn works best for B2B webinars. WhatsApp has the highest open rate (98%+) but must feel personal. Combining 3+ channels produces 2x better attendance than email alone. ShowUpAI supports 6 channels simultaneously: email, LinkedIn Page, LinkedIn Personal, Facebook, Instagram, WhatsApp and Circle.so."
          }
        },
        {
          "@type": "Question",
          "name": "How do I reduce webinar no-shows?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "To reduce webinar no-shows: (1) send reminders across multiple channels; (2) deliver value before the event through insight posts and polls so registrants feel invested; (3) personalise every message with first name and specific webinar details; (4) send a morning-of and 1-hour-before reminder on the day; (5) make joining effortless with a single-click join link. ShowUpAI automates all five tactics simultaneously."
          }
        },
        {
          "@type": "Question",
          "name": "What is webinar lead generation?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Webinar lead generation is using online events to attract, engage and convert prospects. Registrants provide contact details to attend, creating a qualified lead list. The webinar demonstrates expertise and builds trust. Post-event follow-ups convert warm leads into customers. ShowUpAI maximises both attendance (so more leads experience your content) and post-event follow-up conversion."
          }
        },
        {
          "@type": "Question",
          "name": "What is the best webinar software for attendance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most webinar platforms (Zoom, GoToWebinar, WebinarJam, Demio) focus on hosting the live event. ShowUpAI focuses exclusively on attendance — the reminder and engagement sequence before the event. It works alongside any webinar platform and specialises in the 8-touch multi-channel sequence that doubles attendance rates."
          }
        },
        {
          "@type": "Question",
          "name": "How do you write a good webinar reminder email?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A good webinar reminder email should: be under 4 sentences; use the registrant's first name; state the date, time and topic clearly; include one prominent join link; avoid filler phrases like 'I hope this finds you well'. For non-reminder touches, lead with the value (an insight or question) first and mention the webinar at the end. ShowUpAI generates all variants automatically with proper personalisation placeholders."
          }
        },
        {
          "@type": "Question",
          "name": "What is GEO and AEO in digital marketing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GEO (Generative Engine Optimization) is optimising content to appear in AI-generated answers from ChatGPT, Perplexity, Claude and Gemini. AEO (Answer Engine Optimization) is optimising for featured snippets and direct answers in search engines. Both involve structured data (schema markup), FAQ content, and authoritative signals. ShowUpAI is built with both GEO and AEO in mind — it provides direct, accurate answers to the questions webinar hosts search for."
          }
        },
        {
          "@type": "Question",
          "name": "How can AI help with webinar marketing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AI can write webinar reminder emails, LinkedIn posts, Instagram content, WhatsApp messages and follow-up sequences — personalised to your topic and audience. ShowUpAI uses Claude AI to generate 8 different content types per webinar in under 30 seconds, with professional and casual variants for each channel, eliminating the biggest time sink in webinar marketing."
          }
        },
        {
          "@type": "Question",
          "name": "What is a virtual summit and how do you increase attendance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A virtual summit features multiple speakers over multiple days, usually free to attend live. The attendance challenge is identical to webinars: registrants drop off without consistent reminders. ShowUpAI's 8-touch sequence — insight, poll, case study, FOMO — applies equally to virtual summits, masterclasses, workshops and live rooms."
          }
        },
        {
          "@type": "Question",
          "name": "What is the ROI of webinar marketing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Webinars consistently rank as one of the highest-ROI B2B marketing channels. Average cost per lead is £35–80 vs £150+ for paid ads. A webinar with 100 attendees and 10% conversion at £500 generates £5,000 revenue. ShowUpAI doubles attendance — which directly doubles revenue potential from the same registrant list."
          }
        },
        {
          "@type": "Question",
          "name": "How do LinkedIn reminders improve webinar attendance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LinkedIn reminders reach registrants in a professional context where they are already engaged with work-related content. Posting insight content and polls on LinkedIn before your webinar builds credibility, increases organic reach to non-registrants, and re-engages existing registrants. ShowUpAI generates LinkedIn-optimised content for both LinkedIn Page and personal profile, with appropriate hashtags and professional tone."
          }
        },
        {
          "@type": "Question",
          "name": "Can WhatsApp be used for webinar reminders?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. WhatsApp has a 98%+ open rate making it one of the most effective reminder channels. The key is tone: WhatsApp messages must feel personal and conversational, not like a broadcast. ShowUpAI generates WhatsApp-specific copy that reads like a message from a friend — no hashtags, casual language, short and direct — while maintaining the 8-touch sequence structure."
          }
        },
        {
          "@type": "Question",
          "name": "What is a lead room or live room in digital marketing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A live room is an informal live audio or video session on platforms like LinkedIn Live, Twitter/X Spaces, Clubhouse or YouTube Live. Unlike structured webinars, live rooms are conversational. The attendance challenge is the same: getting registered or interested audience members to actually show up at the right time. ShowUpAI's reminder sequence logic applies to live rooms, AMAs, office hours and any scheduled live event."
          }
        }
      ]
    }
    </script>
