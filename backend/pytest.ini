[pytest]
asyncio_mode = auto
# ONE event loop for the whole session. The app and the engine hold module-level
# motor clients (database.py) that bind to the loop on which they are first used;
# with per-test loops every request after the first raises
# "Future attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py